<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金刚般若波罗蜜经</title>
<style>
  :root{
    --bg:#f6f0e2;
    --paper:#fdfaf3;
    --ink:#332c22;
    --muted:#8d8069;
    --accent:#8c2f26;
    --gold:#b08d4f;
    --line:rgba(140,47,38,.14);
    --topbar-bg:rgba(246,240,226,.86);
    --fs:1.05rem;
    --font-kai:"Kaiti SC","KaiTi","STKaiti","楷体",Georgia,"Songti SC",serif;
    --font-song:"Songti SC","STSong","SimSun","宋体",Georgia,serif;
  }
  body.dark{
    --bg:#131110;
    --paper:#1c1917;
    --ink:#d8cebd;
    --muted:#8a8071;
    --accent:#c9886c;
    --gold:#c2a468;
    --line:rgba(194,164,104,.18);
    --topbar-bg:rgba(19,17,16,.86);
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html{scroll-behavior:smooth;}

  body{
    font-family:var(--font-kai);
    color:var(--ink);
    background-color:var(--bg);
    background-image:
      radial-gradient(rgba(0,0,0,.018) 1px, transparent 1px),
      radial-gradient(rgba(0,0,0,.018) 1px, transparent 1px);
    background-size:22px 22px, 22px 22px;
    background-position:0 0, 11px 11px;
    -webkit-font-smoothing:antialiased;
    transition:background-color .4s, color .4s;
  }

  /* ===== 顶部阅读进度 ===== */
  .progress-track{
    position:fixed;top:0;left:0;right:0;height:3px;z-index:90;
  }
  .progress-bar{
    height:100%;width:0;
    background:linear-gradient(90deg,var(--gold),var(--accent));
    transition:width .08s linear;
  }

  /* ===== 侧边目录 ===== */
  .sidebar{
    position:fixed;top:0;left:0;bottom:0;width:252px;z-index:60;
    background:var(--paper);
    border-right:1px solid var(--line);
    overflow-y:auto;
    padding:2rem 0 2.5rem;
    transition:transform .35s cubic-bezier(.4,0,.2,1);
  }
  .sidebar::-webkit-scrollbar{width:5px;}
  .sidebar::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

  .sidebar-title{
    font-family:var(--font-song);
    font-size:.82rem;
    letter-spacing:.5em;
    color:var(--muted);
    text-align:center;
    margin-bottom:1.4rem;
    text-indent:.5em;
  }
  .sidebar-title::after{
    content:"";display:block;width:36px;height:1px;
    background:var(--gold);margin:.9rem auto 0;opacity:.6;
  }

  #toc{display:flex;flex-direction:column;}

  #toc a{
    position:relative;
    display:flex;align-items:baseline;gap:.55rem;
    padding:.52rem 1.5rem .52rem 1.7rem;
    font-size:.86rem;
    color:var(--muted);
    text-decoration:none;
    letter-spacing:.05em;
    border-left:2px solid transparent;
    transition:all .22s;
  }
  #toc a:hover{color:var(--accent);background:rgba(176,141,79,.07);}
  #toc a.active{
    color:var(--accent);
    border-left-color:var(--accent);
    background:rgba(140,47,38,.055);
    font-weight:600;
  }
  .toc-num{
    font-family:var(--font-song);
    font-size:.68rem;
    opacity:.6;
    min-width:1.3em;
    text-align:right;
  }

  .sidebar-foot{
    margin-top:2rem;
    text-align:center;
    font-size:.7rem;
    letter-spacing:.2em;
    color:var(--muted);
    opacity:.55;
    font-family:var(--font-song);
  }

  /* ===== 主区域 ===== */
  .main-wrap{margin-left:252px;}

  .topbar{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;gap:.8rem;
    height:56px;
    padding:0 1.2rem;
    background:var(--topbar-bg);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .topbar-title{
    flex:1;
    text-align:center;
    font-family:var(--font-song);
    font-size:.95rem;
    letter-spacing:.28em;
    color:var(--accent);
    text-indent:.28em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .tools{display:flex;gap:.4rem;}

  .icon-btn{
    font-family:var(--font-song);
    font-size:.78rem;
    color:var(--muted);
    background:transparent;
    border:1px solid var(--line);
    border-radius:6px;
    padding:.34rem .55rem;
    cursor:pointer;
    line-height:1;
    transition:all .2s;
  }
  .icon-btn:hover{color:var(--accent);border-color:var(--accent);}
  .icon-btn:active{transform:scale(.94);}

  #menuBtn{display:none;font-size:1rem;padding:.3rem .55rem;}

  main{
    max-width:768px;
    margin:0 auto;
    padding:0 1.7rem 6rem;
  }

  /* ===== 封面 ===== */
  .cover{
    text-align:center;
    padding:5.5rem 0 4rem;
  }
  .cover-trans{
    font-size:.82rem;
    letter-spacing:.35em;
    color:var(--muted);
    text-indent:.35em;
    margin-bottom:1.8rem;
  }
  .cover h1{
    font-family:var(--font-song);
    font-size:clamp(1.7rem,5vw,2.5rem);
    font-weight:400;
    letter-spacing:.22em;
    color:var(--ink);
    text-indent:.22em;
    line-height:1.6;
  }
  .cover-seal{
    width:70px;height:70px;
    margin:2rem auto 0;
    display:flex;align-items:center;justify-content:center;
    writing-mode:vertical-rl;
    font-family:var(--font-song);
    font-size:1.42rem;
    letter-spacing:.14em;
    color:#fff;
    background:var(--accent);
    border-radius:7px;
    box-shadow:0 4px 16px rgba(140,47,38,.28);
    opacity:.9;
    transition:background .4s;
  }
  .cover-desc{
    margin-top:2.2rem;
    font-size:.8rem;
    letter-spacing:.3em;
    color:var(--muted);
    text-indent:.3em;
  }

  /* ===== 品 ===== */
  .chapter{padding-top:1rem;}

  .chapter-title{
    font-family:var(--font-song);
    font-size:1.12rem;
    font-weight:400;
    letter-spacing:.22em;
    color:var(--accent);
    text-align:center;
    margin:3.6rem 0 2rem;
    text-indent:.22em;
    white-space:nowrap;
  }
  .chapter-title::before,
  .chapter-title::after{
    content:"";
    display:inline-block;
    width:34px;height:1px;
    vertical-align:middle;
    margin:0 .9em;
    background:linear-gradient(to right,transparent,var(--gold));
  }
  .chapter-title::after{
    background:linear-gradient(to left,transparent,var(--gold));
  }

  .chapter-body p{
    font-size:var(--fs);
    line-height:2.15;
    text-indent:2em;
    letter-spacing:.045em;
    margin-bottom:.85em;
    text-align:justify;
    word-break:break-word;
  }

  .gatha{
    margin:1.8em 0 2em;
    padding:1.2em 1rem;
    border-left:3px solid var(--gold);
    background:rgba(176,141,79,.07);
    border-radius:0 6px 6px 0;
    text-align:center;
    font-size:calc(var(--fs) * 1.06);
    line-height:2.3;
    letter-spacing:.1em;
    color:var(--accent);
  }
  .gatha span{display:block;}

  .end-mark{
    text-align:center;
    margin-top:4.5rem;
    font-family:var(--font-song);
    font-size:.82rem;
    letter-spacing:.4em;
    color:var(--muted);
    text-indent:.4em;
    opacity:.75;
  }

  /* ===== 回到顶部 ===== */
  #toTop{
    position:fixed;
    right:1.6rem;bottom:1.8rem;
    width:42px;height:42px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--muted);
    font-size:1rem;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s, transform .3s, color .2s;
    box-shadow:0 4px 14px rgba(0,0,0,.08);
    z-index:55;
  }
  #toTop.show{opacity:.92;pointer-events:auto;}
  #toTop:hover{color:var(--accent);transform:translateY(-3px);}

  /* ===== 遮罩 ===== */
  #overlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(0,0,0,.4);
    z-index:55;
    opacity:0;
    transition:opacity .3s;
  }
  #overlay.show{display:block;opacity:1;}

  /* ===== 移动端 ===== */
  @media (max-width:880px){
    .sidebar{transform:translateX(-100%);box-shadow:0 0 30px rgba(0,0,0,.15);}
    .sidebar.open{transform:none;}
    .main-wrap{margin-left:0;}
    #menuBtn{display:block;}
    main{padding:0 1.25rem 5rem;}
    .cover{padding:3.5rem 0 2.5rem;}
    .chapter-title::before,.chapter-title::after{width:20px;margin:0 .5em;}
    #toTop{right:1rem;bottom:1.2rem;}
  }
</style>
</head>
<body>

<div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-title">目 录</div>
  <nav id="toc"></nav>
  <div class="sidebar-foot">三 十 二 品</div>
</aside>

<div id="overlay"></div>

<div class="main-wrap">
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="打开目录">☰</button>
    <div class="topbar-title">金刚般若波罗蜜经</div>
    <div class="tools">
      <button class="icon-btn" id="fontDown" aria-label="缩小字号">A－</button>
      <button class="icon-btn" id="fontUp" aria-label="放大字号">A＋</button>
      <button class="icon-btn" id="themeBtn" aria-label="切换主题">☾</button>
    </div>
  </header>

  <main id="content"></main>
</div>

<button id="toTop" aria-label="回到顶部">↑</button>

<script>
/* =========================================================
   经文数据（姚秦 鸠摩罗什 译本）
   t:"p" 普通段落 / t:"g" 偈颂
   ========================================================= */
const SUTRA = [
{
  n:1, title:"法会因由分第一",
  body:[
    {t:"p", v:"如是我闻。一时，佛在舍卫国祇树给孤独园，与大比丘众千二百五十人俱。"},
    {t:"p", v:"尔时，世尊食时，著衣持钵，入舍卫大城乞食。于其城中，次第乞已，还至本处。饭食讫，收衣钵，洗足已，敷座而坐。"}
  ]
},
{
  n:2, title:"善现启请分第二",
  body:[
    {t:"p", v:"时，长老须菩提在大众中，即从座起，偏袒右肩，右膝著地，合掌恭敬而白佛言：希有世尊！如来善护念诸菩萨，善付嘱诸菩萨。世尊！善男子、善女人，发阿耨多罗三藐三菩提心，应云何住？云何降伏其心？"},
    {t:"p", v:"佛言：善哉，善哉！须菩提！如汝所说，如来善护念诸菩萨，善付嘱诸菩萨。汝今谛听，当为汝说。善男子、善女人，发阿耨多罗三藐三菩提心，应如是住，如是降伏其心。"},
    {t:"p", v:"唯然，世尊！愿乐欲闻。"}
  ]
},
{
  n:3, title:"大乘正宗分第三",
  body:[
    {t:"p", v:"佛告须菩提：诸菩萨摩诃萨应如是降伏其心：所有一切众生之类，若卵生、若胎生、若湿生、若化生，若有色、若无色，若有想、若无想、若非有想非无想，我皆令入无余涅槃而灭度之。如是灭度无量无数无边众生，实无众生得灭度者。何以故？须菩提！若菩萨有我相、人相、众生相、寿者相，即非菩萨。"}
  ]
},
{
  n:4, title:"妙行无住分第四",
  body:[
    {t:"p", v:"复次，须菩提！菩萨于法，应无所住，行于布施。所谓不住色布施，不住声香味触法布施。须菩提！菩萨应如是布施，不住于相。何以故？若菩萨不住相布施，其福德不可思量。"},
    {t:"p", v:"须菩提！于意云何？东方虚空可思量不？不也，世尊！"},
    {t:"p", v:"须菩提！南西北方、四维上下虚空可思量不？不也，世尊！"},
    {t:"p", v:"须菩提！菩萨无住相布施，福德亦复如是不可思量。须菩提！菩萨但应如所教住。"}
  ]
},
{
  n:5, title:"如理实见分第五",
  body:[
    {t:"p", v:"须菩提！于意云何？可以身相见如来不？不也，世尊！不可以身相得见如来。何以故？如来所说身相，即非身相。"},
    {t:"p", v:"佛告须菩提：凡所有相，皆是虚妄。若见诸相非相，则见如来。"}
  ]
},
{
  n:6, title:"正信希有分第六",
  body:[
    {t:"p", v:"须菩提白佛言：世尊！颇有众生，得闻如是言说章句，生实信不？"},
    {t:"p", v:"佛告须菩提：莫作是说。如来灭后，后五百岁，有持戒修福者，于此章句能生信心，以此为实。当知是人，不于一佛二佛三四五佛而种善根，已于无量千万佛所种诸善根。闻是章句，乃至一念生净信者，须菩提！如来悉知悉见，是诸众生得如是无量福德。何以故？是诸众生，无复我相、人相、众生相、寿者相，无法相，亦无非法相。何以故？是诸众生，若心取相，即为著我、人、众生、寿者；若取法相，即著我、人、众生、寿者。何以故？若取非法相，即著我、人、众生、寿者。是故不应取法，不应取非法。以是义故，如来常说：汝等比丘，知我说法，如筏喻者，法尚应舍，何况非法。"}
  ]
},
{
  n:7, title:"无得无说分第七",
  body:[
    {t:"p", v:"须菩提！于意云何？如来得阿耨多罗三藐三菩提耶？如来有所说法耶？"},
    {t:"p", v:"须菩提言：如我解佛所说义，无有定法名阿耨多罗三藐三菩提，亦无有定法如来可说。何以故？如来所说法，皆不可取、不可说，非法、非非法。所以者何？一切贤圣，皆以无为法而有差别。"}
  ]
},
{
  n:8, title:"依法出生分第八",
  body:[
    {t:"p", v:"须菩提！于意云何？若人满三千大千世界七宝以用布施，是人所得福德，宁为多不？须菩提言：甚多，世尊！何以故？是福德即非福德性，是故如来说福德多。"},
    {t:"p", v:"若复有人，于此经中受持乃至四句偈等，为他人说，其福胜彼。何以故？须菩提！一切诸佛及诸佛阿耨多罗三藐三菩提法，皆从此经出。须菩提！所谓佛法者，即非佛法。"}
  ]
},
{
  n:9, title:"一相无相分第九",
  body:[
    {t:"p", v:"须菩提！于意云何？须陀洹能作是念，我得须陀洹果不？须菩提言：不也，世尊！何以故？须陀洹名为入流，而无所入，不入色声香味触法，是名须陀洹。"},
    {t:"p", v:"须菩提！于意云何？斯陀含能作是念，我得斯陀含果不？须菩提言：不也，世尊！何以故？斯陀含名一往来，而实无往来，是名斯陀含。"},
    {t:"p", v:"须菩提！于意云何？阿那含能作是念，我得阿那含果不？须菩提言：不也，世尊！何以故？阿那含名为不来，而实无不来，是故名阿那含。"},
    {t:"p", v:"须菩提！于意云何？阿罗汉能作是念，我得阿罗汉道不？须菩提言：不也，世尊！何以故？实无有法名阿罗汉。世尊！若阿罗汉作是念，我得阿罗汉道，即为著我、人、众生、寿者。世尊！佛说我得无诤三昧，人中最为第一，是第一离欲阿罗汉。世尊！我不作是念，我是离欲阿罗汉。世尊！我若作是念，我得阿罗汉道，世尊则不说须菩提是乐阿兰那行者。以须菩提实无所行，而名须菩提是乐阿兰那行。"}
  ]
},
{
  n:10, title:"庄严净土分第十",
  body:[
    {t:"p", v:"佛告须菩提：于意云何？如来昔在然灯佛所，于法有所得不？不也，世尊！如来在然灯佛所，于法实无所得。"},
    {t:"p", v:"须菩提！于意云何？菩萨庄严佛土不？不也，世尊！何以故？庄严佛土者，即非庄严，是名庄严。"},
    {t:"p", v:"是故须菩提！诸菩萨摩诃萨应如是生清净心，不应住色生心，不应住声香味触法生心，应无所住而生其心。须菩提！譬如有人，身如须弥山王，于意云何？是身为大不？须菩提言：甚大，世尊！何以故？佛说非身，是名大身。"}
  ]
},
{
  n:11, title:"无为福胜分第十一",
  body:[
    {t:"p", v:"须菩提！如恒河中所有沙数，如是沙等恒河，于意云何？是诸恒河沙，宁为多不？须菩提言：甚多，世尊！但诸恒河尚多无数，何况其沙。"},
    {t:"p", v:"须菩提！我今实言告汝：若有善男子、善女人，以七宝满尔所恒河沙数三千大千世界，以用布施，得福多不？须菩提言：甚多，世尊！"},
    {t:"p", v:"佛告须菩提：若善男子、善女人，于此经中，乃至受持四句偈等，为他人说，而此福德胜前福德。"}
  ]
},
{
  n:12, title:"尊重正教分第十二",
  body:[
    {t:"p", v:"复次，须菩提！随说是经，乃至四句偈等，当知此处，一切世间天、人、阿修罗，皆应供养，如佛塔庙。何况有人尽能受持读诵。须菩提！当知是人成就最上第一希有之法。若是经典所在之处，即为有佛，若尊重弟子。"}
  ]
},
{
  n:13, title:"如法受持分第十三",
  body:[
    {t:"p", v:"尔时，须菩提白佛言：世尊！当何名此经？我等云何奉持？"},
    {t:"p", v:"佛告须菩提：是经名为金刚般若波罗蜜，以是名字，汝当奉持。所以者何？须菩提！佛说般若波罗蜜，即非般若波罗蜜，是名般若波罗蜜。须菩提！于意云何？如来有所说法不？须菩提白佛言：世尊！如来无所说。"},
    {t:"p", v:"须菩提！于意云何？三千大千世界所有微尘，是为多不？须菩提言：甚多，世尊！"},
    {t:"p", v:"须菩提！诸微尘，如来说非微尘，是名微尘。如来说世界，非世界，是名世界。须菩提！于意云何？可以三十二相见如来不？不也，世尊！不可以三十二相得见如来。何以故？如来说三十二相，即是非相，是名三十二相。"},
    {t:"p", v:"须菩提！若有善男子、善女人，以恒河沙等身命布施；若复有人，于此经中，乃至受持四句偈等，为他人说，其福甚多。"}
  ]
},
{
  n:14, title:"离相寂灭分第十四",
  body:[

/* =========================================================
   渲染
   ========================================================= */
const contentEl = document.getElementById('content');
const tocEl = document.getElementById('toc');

(function renderAll(){
  let html = `
    <div class="cover">
      <div class="cover-trans">姚秦三藏法师鸠摩罗什 译</div>
      <h1>金刚般若波罗蜜经</h1>
      <div class="cover-seal">般若</div>
      <div class="cover-desc">全文 · 三十二品</div>
    </div>`;

  SUTRA.forEach(ch => {
    let bodyHTML = '';
    ch.body.forEach(seg => {
      if (seg.t === 'g') {
        bodyHTML += `<div class="gatha">${seg.v.map(l => `<span>${l}</span>`).join('')}</div>`;
      } else {
        bodyHTML += `<p>${seg.v}</p>`;
      }
    });
    html += `<section class="chapter" id="ch${ch.n}">
      <h2 class="chapter-title">${ch.title}</h2>
      <div class="chapter-body">${bodyHTML}</div>
    </section>`;
  });

  html += `<div class="end-mark">金 刚 经 终</div>`;
  contentEl.innerHTML = html;

  tocEl.innerHTML = SUTRA.map(ch =>
    `<a href="#ch${ch.n}"><span class="toc-num">${ch.n}</span>${ch.title}</a>`
  ).join('');
})();

/* =========================================================
   滚动：进度条 / 目录高亮 / 回到顶部
   ========================================================= */
const progressBar = document.getElementById('progressBar');
const toTopBtn = document.getElementById('toTop');
const sections = Array.from(document.querySelectorAll('.chapter'));
const tocLinks = Array.from(tocEl.querySelectorAll('a'));

let ticking = false;
function onScroll(){
  const st = window.scrollY || document.documentElement.scrollTop;
  const max = document.documentElement.scrollHeight - window.innerHeight;
  progressBar.style.width = (max > 0 ? (st / max) * 100 : 0) + '%';

  toTopBtn.classList.toggle('show', st > 600);

  let activeIdx = 0;
  for (let i = 0; i < sections.length; i++){
    if (sections[i].getBoundingClientRect().top <= 150) activeIdx = i;
  }
  tocLinks.forEach((a, i) => a.classList.toggle('active', i === activeIdx));
  ticking = false;
}
window.addEventListener('scroll', () => {
  if (!ticking){ ticking = true; requestAnimationFrame(onScroll); }
}, {passive:true});
onScroll();

toTopBtn.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));

/* =========================================================
   目录抽屉（移动端）
   ========================================================= */
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
const menuBtn = document.getElementById('menuBtn');

function closeSidebar(){
  sidebar.classList.remove('open');
  overlay.classList.remove('show');
}
menuBtn.addEventListener('click', () => {
  sidebar.classList.toggle('open');
  overlay.classList.toggle('show', sidebar.classList.contains('open'));
});
overlay.addEventListener('click', closeSidebar);
tocEl.addEventListener('click', e => {
  if (e.target.closest('a') && window.innerWidth <= 880) closeSidebar();
});

/* =========================================================
   主题切换
   ========================================================= */
const themeBtn = document.getElementById('themeBtn');
const bodyEl = document.body;
let isDark = false;
try { isDark = localStorage.getItem('jingang-theme') === 'dark'; } catch(e){}

function applyTheme(){
  bodyEl.classList.toggle('dark', isDark);
  themeBtn.textContent = isDark ? '☀' : '☾';
}
applyTheme();
themeBtn.addEventListener('click', () => {
  isDark = !isDark;
  applyTheme();
  try { localStorage.setItem('jingang-theme', isDark ? 'dark' : 'light'); } catch(e){}
});

/* =========================================================
   字号调节
   ========================================================= */
const root = document.documentElement;
let fontSize = 1.05;
try {
  const saved = localStorage.getItem('jingang-fs');
  if (saved) fontSize = parseFloat(saved) || 1.05;
} catch(e){}

function applyFont(){
  root.style.setProperty('--fs', fontSize.toFixed(2) + 'rem');
}
applyFont();

document.getElementById('fontUp').addEventListener('click', () => {
  fontSize = Math.min(fontSize + 0.08, 1.75);
  applyFont();
  try { localStorage.setItem('jingang-fs', fontSize); } catch(e){}
});
document.getElementById('fontDown').addEventListener('click', () => {
  fontSize = Math.max(fontSize - 0.08, 0.85);
  applyFont();
  try { localStorage.setItem('jingang-fs', fontSize); } catch(e){}
});
</script>
</body>
</html>
