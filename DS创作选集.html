<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>文章集</title>
<style>
  :root{
    --bg:#f6f5f2; --panel:#ffffff; --text:#232019; --muted:#918a7d;
    --border:#e9e5dd; --hover:#f2efe9; --accent:#9a5b34;
    --shadow:0 12px 40px rgba(0,0,0,.10);
    --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
  }
  [data-theme="dark"]{
    --bg:#161513; --panel:#1d1c1a; --text:#e8e4dc; --muted:#8f887c;
    --border:#2c2a26; --hover:#26241f; --accent:#d79a6a;
    --shadow:0 12px 40px rgba(0,0,0,.45);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .2s,color .2s;
  }
  button{font:inherit;}

  /* ============ 布局 ============ */
  .app{display:grid;grid-template-columns:300px 1fr;height:100vh;height:100dvh;}

  /* ============ 侧边栏 ============ */
  .sidebar{
    background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;min-height:0;
  }
  .sidebar-top{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 18px 10px;
  }
  .brand-title{font-weight:700;font-size:16px;letter-spacing:.02em;}
  .brand-count{font-size:12px;color:var(--muted);margin-left:6px;}
  .icon-btn{
    width:30px;height:30px;border-radius:8px;border:1px solid var(--border);
    background:transparent;color:var(--muted);cursor:pointer;line-height:1;
    transition:background .15s,color .15s;
  }
  .icon-btn:hover{background:var(--hover);color:var(--text);}

  .search-wrap{padding:0 18px 12px;}
  .search-wrap input{
    width:100%;padding:8px 12px;border-radius:9px;border:1px solid var(--border);
    background:var(--bg);color:var(--text);font-size:13px;outline:none;
    -webkit-appearance:none;appearance:none;
  }
  .search-wrap input:focus{border-color:var(--accent);}
  .search-wrap input::-webkit-search-cancel-button{-webkit-appearance:none;}

  .list{flex:1;overflow-y:auto;padding:4px 10px 14px;}
  .list::-webkit-scrollbar{width:8px;}
  .list::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  .list::-webkit-scrollbar-thumb:hover{background:var(--muted);}

  .item{
    display:flex;align-items:center;gap:8px;
    width:100%;text-align:left;border:0;background:transparent;
    padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--text);
    font-size:14px;line-height:1.5;margin-bottom:2px;
    transition:background .12s;
  }
  .item:hover{background:var(--hover);}
  .item.active{background:var(--hover);color:var(--accent);font-weight:600;}

  .item .idx{
    flex:0 0 auto;min-width:20px;height:20px;padding:0 5px;border-radius:6px;
    background:var(--hover);color:var(--muted);font-size:11px;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .item.active .idx{background:var(--accent);color:#fff;}
  .item .label{
    flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  .list-empty{padding:16px;font-size:13px;color:var(--muted);}

  /* ============ 正文区 ============ */
  .main{position:relative;overflow-y:auto;min-width:0;scroll-behavior:smooth;}
  .reader{max-width:720px;margin:0 auto;padding:72px 40px 140px;}

  .reader h1{
    font-size:30px;line-height:1.42;margin:0 0 12px;
    font-weight:700;letter-spacing:.01em;
  }
  .meta{
    font-size:13px;color:var(--muted);
    padding-bottom:22px;margin-bottom:32px;border-bottom:1px solid var(--border);
  }
  .reader p{
    font-family:var(--serif);
    font-size:18px;line-height:2.05;margin:0 0 1.35em;
    letter-spacing:.015em;text-align:justify;text-justify:inter-ideograph;
  }

  /* ★ 引言整体包裹，左侧一条连续的竖线 */
  .reader .intro{
    border-left:3px solid var(--border);
    padding-left:18px;
    margin:0 0 1.9em;
  }
  .reader .intro p{
    color:var(--muted);
    font-size:16.5px;
    line-height:1.95;
    margin:0 0 .9em;
    border-left:0;
    padding-left:0;
  }
  .reader .intro p:last-child{margin-bottom:0;}

  .pager{
    display:flex;gap:12px;justify-content:space-between;
    margin-top:56px;padding-top:24px;border-top:1px solid var(--border);
  }
  .btn{
    padding:9px 16px;border-radius:9px;border:1px solid var(--border);
    background:var(--panel);color:var(--text);cursor:pointer;font-size:14px;
    transition:background .15s,filter .15s;
  }
  .btn:hover{background:var(--hover);}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn:disabled:hover{background:var(--panel);}

  .menu-btn{display:none;}

  /* ============ 空 / 错误状态 ============ */
  .state{
    max-width:520px;margin:0 auto;padding:96px 32px;
    text-align:center;color:var(--muted);line-height:1.9;font-size:14px;
  }
  .state h2{
    color:var(--text);font-weight:600;font-size:17px;
    letter-spacing:.02em;margin:0 0 12px;
  }
  .state code{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    background:var(--hover);padding:.15em .45em;border-radius:4px;
    color:var(--text);font-size:13px;
  }
  .state pre{
    background:var(--hover);border:1px solid var(--border);
    padding:10px 14px;border-radius:9px;text-align:left;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:12.5px;color:var(--text);overflow-x:auto;margin:12px 0;
  }

  /* ============ 遮罩 ============ */
  .scrim{
    display:none;position:fixed;inset:0;z-index:25;
    background:rgba(0,0,0,.35);
  }
  .scrim.show{display:block;}

  /* ============ 响应式 ============ */
  @media (max-width:820px){
    .app{grid-template-columns:1fr;}
    .sidebar{
      position:fixed;top:0;left:0;bottom:0;width:280px;z-index:30;
      transform:translateX(-100%);transition:transform .25s ease;
      box-shadow:var(--shadow);
    }
    .sidebar.open{transform:translateX(0);}
    .menu-btn{
      display:flex;position:fixed;top:14px;left:14px;z-index:20;
      width:38px;height:38px;align-items:center;justify-content:center;
      border-radius:10px;border:1px solid var(--border);
      background:var(--panel);color:var(--text);cursor:pointer;font-size:16px;
      box-shadow:0 2px 10px rgba(0,0,0,.08);
    }
    .reader{padding:78px 22px 120px;}
    .reader h1{font-size:24px;}
    .reader p{font-size:17px;line-height:1.95;}
    .reader .intro p{font-size:15.5px;}
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div>
        <span class="brand-title">文章集</span>
        <span class="brand-count" id="count"></span>
      </div>
      <button class="icon-btn" id="themeBtn" title="切换深浅色">◐</button>
    </div>

    <div class="search-wrap">
      <input id="search" type="search" placeholder="搜索标题…" autocomplete="off" />
    </div>

    <nav class="list" id="list"></nav>
  </aside>

  <main class="main" id="main">
    <button class="menu-btn" id="menuBtn" title="目录">☰</button>
    <article class="reader" id="reader">
      <div class="state"><h2>载入中</h2><p>正在读取 docs/ 下的文章…</p></div>
    </article>
  </main>
</div>

<div class="scrim" id="scrim"></div>

<script>
(function () {
  'use strict';

  const $ = (s) => document.querySelector(s);
  const els = {
    list: $('#list'),
    count: $('#count'),
    search: $('#search'),
    reader: $('#reader'),
    main: $('#main'),
    sidebar: $('#sidebar'),
    scrim: $('#scrim'),
    menuBtn: $('#menuBtn'),
    themeBtn: $('#themeBtn')
  };

  const state = {
    articles: [],
    currentId: null,
    query: ''
  };

  /* ---------------- 工具 ---------------- */
  const esc = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));

  /* ---------------- 文章解析 ----------------
     结构：标题 / 空行 / 引言(可多行，可无) / 空行 / 正文
  ---------------------------------------------- */
  function parseArticle(filename, raw) {
    const base = filename.replace(/\.txt$/i, '').trim() || filename;
    const lines = raw
      .replace(/^\uFEFF/, '')
      .replace(/\r\n?/g, '\n')
      .split('\n');

    // 跳过开头的空行，取第一行非空行作为标题
    let i = 0;
    while (i < lines.length && !lines[i].trim()) i++;
    const title = (lines[i] || '').trim() || base;
    i++;

    // 剩余内容按空行切块
    const blocks = [];
    let cur = [];
    for (; i < lines.length; i++) {
      const t = lines[i].trim();
      if (t === '') {
        if (cur.length) { blocks.push(cur); cur = []; }
      } else {
        cur.push(t);
      }
    }
    if (cur.length) blocks.push(cur);

    // ≥2 块 → 第一块为引言；1 块 → 无引言，全部为正文
    let intro = [];
    let bodyBlocks = blocks;
    if (blocks.length >= 2) {
      intro = blocks[0];
      bodyBlocks = blocks.slice(1);
    }

    const body = [];
    bodyBlocks.forEach((blk) => {
      for (let k = 0; k < blk.length; k++) body.push(blk[k]);
    });

    if (!intro.length && !body.length) body.push('（本文暂无正文）');

    // 文件名开头的数字作为序号
    const m = base.match(/^(\d+)/);
    const order = m ? parseInt(m[1], 10) : null;

    return {
      id: filename,
      name: base,
      title: title,
      intro: intro,
      body: body,
      chars: raw.replace(/\s/g, '').length,
      order: order,
      importIndex: 0
    };
  }

  /* ---------------- 渲染列表 ---------------- */
  function renderList() {
    const q = state.query.trim().toLowerCase();
    const items = state.articles.filter((a) =>
      !q || a.title.toLowerCase().includes(q) || a.name.toLowerCase().includes(q)
    );

    els.count.textContent = state.articles.length
      ? state.articles.length + ' 篇' : '';

    if (!state.articles.length) { els.list.innerHTML = ''; return; }

    if (!items.length) {
      els.list.innerHTML = '<div class="list-empty">没有匹配的文章</div>';
      return;
    }

    els.list.innerHTML = items.map((a) => {
      const badge = a.order !== null
        ? '<span class="idx">' + a.order + '</span>'
        : '<span class="idx">·</span>';
      return '<button class="item' + (a.id === state.currentId ? ' active' : '') +
        '" data-id="' + esc(a.id) + '" title="' + esc(a.title) + '">' +
        badge + '<span class="label">' + esc(a.title) + '</span></button>';
    }).join('');
  }

  /* ---------------- 渲染正文 ---------------- */
  function renderArticle() {
    const idx = state.articles.findIndex((a) => a.id === state.currentId);
    if (idx < 0) { els.reader.innerHTML = ''; return; }

    const a = state.articles[idx];
    const mins = Math.max(1, Math.round(a.chars / 400));

    let html =
      '<h1>' + esc(a.title) + '</h1>' +
      '<div class="meta">第 ' + (idx + 1) + ' / ' + state.articles.length +
      ' 篇 · 约 ' + a.chars + ' 字 · ' + mins + ' 分钟</div>';

    // ★ 多段引言包在同一个 .intro 里，竖线连续
    if (a.intro.length) {
      html += '<div class="intro">';
      a.intro.forEach((p) => {
        html += '<p>' + esc(p) + '</p>';
      });
      html += '</div>';
    }

    a.body.forEach((p) => {
      html += '<p>' + esc(p) + '</p>';
    });

    html +=
      '<div class="pager">' +
        '<button class="btn" id="prevBtn"' +
          (idx === 0 ? ' disabled' : '') + '>← 上一篇</button>' +
        '<button class="btn" id="nextBtn"' +
          (idx === state.articles.length - 1 ? ' disabled' : '') + '>下一篇 →</button>' +
      '</div>';

    els.reader.innerHTML = html;

    const prev = $('#prevBtn');
    const next = $('#nextBtn');
    if (prev) prev.addEventListener('click', () => goto(idx - 1));
    if (next) next.addEventListener('click', () => goto(idx + 1));
  }

  function goto(i) {
    if (i < 0 || i >= state.articles.length) return;
    state.currentId = state.articles[i].id;
    renderList();
    renderArticle();
    els.main.scrollTop = 0;
  }

  function selectById(id) {
    if (!state.articles.some((a) => a.id === id)) return;
    state.currentId = id;
    renderList();
    renderArticle();
    els.main.scrollTop = 0;
    closeDrawer();
  }

  /* ---------------- 状态提示 ---------------- */
  function showState(title, html) {
    els.reader.innerHTML =
      '<div class="state"><h2>' + esc(title) + '</h2>' + html + '</div>';
  }

  /* ---------------- 加载流程 ---------------- */
  async function fetchText(url) {
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) return null;
      return await res.text();
    } catch (e) {
      return null;
    }
  }

  async function boot() {
    // 1. 找清单文件，确定文章目录
    const manifestCandidates = [
      'docs/list.txt',
      './docs/list.txt',
      'list.txt'
    ];

    let manifestText = null;
    let baseDir = 'docs/';

    for (let i = 0; i < manifestCandidates.length; i++) {
      const path = manifestCandidates[i];
      const text = await fetchText(path);
      if (text !== null) {
        manifestText = text;
        baseDir = path.slice(0, path.lastIndexOf('/') + 1);
        break;
      }
    }

    if (manifestText === null) {
      showState('无法读取文章清单',
        '<p>未能找到 <code>docs/list.txt</code>。</p>' +
        '<p>若直接用 <code>file://</code> 打开本页，浏览器会因安全策略阻止读取本地文件。' +
        '请在页面所在目录启动一个本地服务器：</p>' +
        '<pre>python3 -m http.server 8000</pre>' +
        '<p>然后访问 <code>http://localhost:8000/</code></p>');
      return;
    }

    // 2. 解析清单：每行一个 .txt 文件名
    const names = manifestText
      .replace(/^\uFEFF/, '')
      .split(/\r?\n/)
      .map((s) => s.trim())
      .filter((s) => s && !s.startsWith('#') && /\.txt$/i.test(s));

    if (!names.length) {
      showState('文章清单为空',
        '<p><code>docs/list.txt</code> 中没有解析到任何 .txt 文件名。</p>');
      return;
    }

    // 3. 逐个拉取并解析
    showState('载入中', '<p>共 ' + names.length + ' 篇，正在读取…</p>');

    const articles = [];
    for (let i = 0; i < names.length; i++) {
      const name = names[i];
      if (name.includes('/') || name.includes('\\') || name.includes('..')) continue;

      const text = await fetchText(baseDir + encodeURIComponent(name));
      if (text === null) {
        console.warn('加载失败：' + name);
        continue;
      }
      const a = parseArticle(name, text);
      a.importIndex = i;
      articles.push(a);
    }

    if (!articles.length) {
      showState('没有加载到文章',
        '<p>清单中的文件全部读取失败，请检查 <code>docs/</code> 下的文件是否存在。</p>');
      return;
    }

    // 4. 按文件名序号排序
    articles.sort((a, b) => {
      if (a.order !== null && b.order !== null) {
        if (a.order !== b.order) return a.order - b.order;
      } else if (a.order !== null) {
        return -1;
      } else if (b.order !== null) {
        return 1;
      }
      return a.title.localeCompare(b.title, 'zh-Hans-CN', { numeric: true });
    });

    state.articles = articles;
    state.currentId = articles[0].id;

    renderList();
    renderArticle();
    els.main.scrollTop = 0;
  }

  /* ---------------- 抽屉 ---------------- */
  function openDrawer() {
    els.sidebar.classList.add('open');
    els.scrim.classList.add('show');
  }
  function closeDrawer() {
    els.sidebar.classList.remove('open');
    els.scrim.classList.remove('show');
  }

  /* ---------------- 事件绑定 ---------------- */
  els.list.addEventListener('click', (e) => {
    const btn = e.target.closest('.item');
    if (btn) selectById(btn.dataset.id);
  });

  els.search.addEventListener('input', (e) => {
    state.query = e.target.value;
    renderList();
  });

  els.menuBtn.addEventListener('click', () => {
    if (els.sidebar.classList.contains('open')) closeDrawer();
    else openDrawer();
  });
  els.scrim.addEventListener('click', closeDrawer);

  // 主题
  const savedTheme = localStorage.getItem('theme');
  document.documentElement.setAttribute(
    'data-theme',
    savedTheme ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
  );
  els.themeBtn.addEventListener('click', () => {
    const next =
      document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });

  // 键盘左右翻篇
  document.addEventListener('keydown', (e) => {
    if (e.target.matches('input, textarea')) return;
    const idx = state.articles.findIndex((a) => a.id === state.currentId);
    if (idx < 0) return;
    if (e.key === 'ArrowLeft') goto(idx - 1);
    else if (e.key === 'ArrowRight') goto(idx + 1);
  });

  /* ---------------- 启动 ---------------- */
  boot();
})();
</script>
</body>
</html>
