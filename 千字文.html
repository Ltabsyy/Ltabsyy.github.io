<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>千字文 · 全文</title>
<style>
  :root{
    --paper:#fdfaf3;
    --ink:#2c2722;
    --ink-soft:#7a7062;
    --line:#e7ddc8;
    --accent:#a8402f;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{ scroll-behavior:smooth; }

  body{
    font-family:"STKaiti","KaiTi","Kaiti SC","楷体","Songti SC","SimSun",serif;
    background:#ece5d5;
    background-image:
      radial-gradient(circle at 12% 8%, rgba(255,255,255,.85), transparent 42%),
      radial-gradient(circle at 88% 92%, rgba(214,197,164,.55), transparent 50%);
    color:var(--ink);
    min-height:100vh;
    padding:56px 18px 90px;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ---------- 纸面 ---------- */
  .paper{
    position:relative;
    max-width:880px;
    margin:0 auto;
    padding:64px 58px 70px;
    background:var(--paper);
    border:1px solid var(--line);
    box-shadow:
      0 1px 0 #fff inset,
      0 4px 14px rgba(90,70,40,.08),
      0 28px 64px -30px rgba(90,70,40,.45);
  }
  .paper::after{
    content:"";
    position:absolute;
    inset:16px;
    border:1px solid #f0e8d6;
    pointer-events:none;
  }

  /* ---------- 页首 ---------- */
  .head{
    text-align:center;
    margin-bottom:52px;
  }
  .head h1{
    font-size:clamp(34px,7vw,52px);
    font-weight:400;
    letter-spacing:.34em;
    text-indent:.34em;
    color:#241f1a;
  }
  .head .meta{
    margin-top:16px;
    font-size:14px;
    letter-spacing:.26em;
    text-indent:.26em;
    color:var(--ink-soft);
  }
  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-top:26px;
  }
  .divider span{
    width:72px;
    height:1px;
    background:linear-gradient(90deg,transparent,#d8cdb2,transparent);
  }
  .divider i{
    width:6px;
    height:6px;
    background:var(--accent);
    transform:rotate(45deg);
    opacity:.7;
  }

  /* ---------- 正文 ---------- */
  .content{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .stanza{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px 26px;
  }
  .verse{
    text-align:center;
    font-size:clamp(19px,2.7vw,24px);
    line-height:1.7;
    letter-spacing:.2em;
    text-indent:.2em;
    padding:7px 6px;
    border-radius:6px;
    color:#38322a;
    cursor:default;
    opacity:0;
    transform:translateY(10px);
    transition:
      opacity .8s ease,
      transform .8s ease,
      background-color .35s ease,
      color .35s ease;
  }
  .stanza .verse:nth-child(2){ transition-delay:.1s; }
  .verse.show{ opacity:1; transform:none; }
  .verse:hover{
    background:#f6efdf;
    color:var(--accent);
  }

  /* ---------- 页脚 ---------- */
  .foot{
    margin-top:58px;
    padding-top:32px;
    border-top:1px solid var(--line);
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
  }
  .foot p{
    font-size:13px;
    line-height:2.1;
    letter-spacing:.1em;
    color:var(--ink-soft);
    max-width:520px;
  }
  .seal{
    writing-mode:vertical-rl;
    height:70px;
    padding:7px 6px;
    border:2px solid var(--accent);
    border-radius:5px;
    color:var(--accent);
    font-size:15px;
    letter-spacing:3px;
    opacity:.82;
    user-select:none;
    flex:none;
  }

  /* ---------- 响应式 ---------- */
  @media (max-width:680px){
    body{ padding:26px 10px 60px; }
    .paper{ padding:40px 24px 46px; }
    .paper::after{ display:none; }
    .stanza{ grid-template-columns:1fr; gap:2px; }
    .stanza .verse:nth-child(2){ transition-delay:0s; }
    .foot{ justify-content:center; }
  }
</style>
</head>
<body>

  <div class="paper">
    <header class="head">
      <h1>千字文</h1>
      <p class="meta">南朝 · 周兴嗣 撰</p>
      <div class="divider"><span></span><i></i><span></span></div>
    </header>

    <main class="content" id="content"></main>

    <footer class="foot">
      <p>
        全文一千字，四字一句，两句一韵，对仗工整，条理清晰。<br>
        自天地开辟、日月星辰，至修身齐家、治国理政，包罗万象，
        是中国古代流传最广的蒙学经典之一。
      </p>
      <div class="seal">千字文</div>
    </footer>
  </div>

<script>
  /* 全文（以逗号、句号断句，每四字一读） */
  const SOURCE = `
天地玄黄，宇宙洪荒。日月盈昃，辰宿列张。
寒来暑往，秋收冬藏。闰余成岁，律吕调阳。
云腾致雨，露结为霜。金生丽水，玉出昆冈。
剑号巨阙，珠称夜光。果珍李柰，菜重芥姜。
海咸河淡，鳞潜羽翔。龙师火帝，鸟官人皇。
始制文字，乃服衣裳。推位让国，有虞陶唐。
吊民伐罪，周发殷汤。坐朝问道，垂拱平章。
爱育黎首，臣伏戎羌。遐迩一体，率宾归王。
鸣凤在竹，白驹食场。化被草木，赖及万方。
盖此身发，四大五常。恭惟鞠养，岂敢毁伤。
女慕贞洁，男效才良。知过必改，得能莫忘。
罔谈彼短，靡恃己长。信使可覆，器欲难量。
墨悲丝染，诗赞羔羊。景行维贤，克念作圣。
德建名立，形端表正。空谷传声，虚堂习听。
祸因恶积，福缘善庆。尺璧非宝，寸阴是竞。
资父事君，曰严与敬。孝当竭力，忠则尽命。
临深履薄，夙兴温凊。似兰斯馨，如松之盛。
川流不息，渊澄取映。容止若思，言辞安定。
笃初诚美，慎终宜令。荣业所基，籍甚无竟。
学优登仕，摄职从政。存以甘棠，去而益咏。
乐殊贵贱，礼别尊卑。上和下睦，夫唱妇随。
外受傅训，入奉母仪。诸姑伯叔，犹子比儿。
孔怀兄弟，同气连枝。交友投分，切磨箴规。
仁慈隐恻，造次弗离。节义廉退，颠沛匪亏。
性静情逸，心动神疲。守真志满，逐物意移。
坚持雅操，好爵自縻。都邑华夏，东西二京。
背邙面洛，浮渭据泾。宫殿盘郁，楼观飞惊。
图写禽兽，画彩仙灵。丙舍旁启，甲帐对楹。
肆筵设席，鼓瑟吹笙。升阶纳陛，弁转疑星。
右通广内，左达承明。既集坟典，亦聚群英。
杜稿钟隶，漆书壁经。府罗将相，路侠槐卿。
户封八县，家给千兵。高冠陪辇，驱毂振缨。
世禄侈富，车驾肥轻。策功茂实，勒碑刻铭。
磻溪伊尹，佐时阿衡。奄宅曲阜，微旦孰营。
桓公匡合，济弱扶倾。绮回汉惠，说感武丁。
俊乂密勿，多士实宁。晋楚更霸，赵魏困横。
假途灭虢，践土会盟。何遵约法，韩弊烦刑。
起翦颇牧，用军最精。宣威沙漠，驰誉丹青。
九州禹迹，百郡秦并。岳宗泰岱，禅主云亭。
雁门紫塞，鸡田赤城。昆池碣石，钜野洞庭。
旷远绵邈，岩岫杳冥。治本于农，务兹稼穑。
俶载南亩，我艺黍稷。税熟贡新，劝赏黜陟。
孟轲敦素，史鱼秉直。庶几中庸，劳谦谨敕。
聆音察理，鉴貌辨色。贻厥嘉猷，勉其祗植。
省躬讥诫，宠增抗极。殆辱近耻，林皋幸即。
两疏见机，解组谁逼。索居闲处，沉默寂寥。
求古寻论，散虑逍遥。欣奏累遣，戚谢欢招。
渠荷的历，园莽抽条。枇杷晚翠，梧桐蚤凋。
陈根委翳，落叶飘摇。游鹍独运，凌摩绛霄。
耽读玩市，寓目囊箱。易輶攸畏，属耳垣墙。
具膳餐饭，适口充肠。饱饫烹宰，饥厌糟糠。
亲戚故旧，老少异粮。妾御绩纺，侍巾帷房。
纨扇圆洁，银烛炜煌。昼眠夕寐，蓝笋象床。
弦歌酒宴，接杯举觞。矫手顿足，悦豫且康。
嫡后嗣续，祭祀烝尝。稽颡再拜，悚惧恐惶。
笺牒简要，顾答审详。骸垢想浴，执热愿凉。
驴骡犊特，骇跃超骧。诛斩贼盗，捕获叛亡。
布射僚丸，嵇琴阮啸。恬笔伦纸，钧巧任钓。
释纷利俗，并皆佳妙。毛施淑姿，工颦妍笑。
年矢每催，曦晖朗曜。璇玑悬斡，晦魄环照。
指薪修祜，永绥吉劭。矩步引领，俯仰廊庙。
束带矜庄，徘徊瞻眺。孤陋寡闻，愚蒙等诮。
谓语助者，焉哉乎也。
`;

  /* 按逗号、句号切分成四字短语 */
  const phrases = SOURCE.replace(/\s+/g, '').split(/[，。]/).filter(Boolean);

  /* 生成 DOM：两句一行 */
  const content = document.getElementById('content');
  const frag = document.createDocumentFragment();

  for (let i = 0; i < phrases.length; i += 2) {
    const row = document.createElement('div');
    row.className = 'stanza';
    for (let j = i; j < i + 2 && j < phrases.length; j++) {
      const span = document.createElement('span');
      span.className = 'verse';
      span.textContent = phrases[j];
      row.appendChild(span);
    }
    frag.appendChild(row);
  }
  content.appendChild(frag);

  /* 滚动进入视口时逐句浮现 */
  const verses = document.querySelectorAll('.verse');

  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('show');
          io.unobserve(entry.target);
        }
      });
    }, { rootMargin: '0px 0px -50px 0px', threshold: 0 });

    verses.forEach(v => io.observe(v));
  } else {
    verses.forEach(v => v.classList.add('show'));
  }
</script>

</body>
</html>
