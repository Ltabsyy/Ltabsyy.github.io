<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>乱言 · chaos-word</title>
<style>
  :root{
    --bg:#0d0e11;
    --fg:#d8d5cd;
    --muted:#8f8b81;
    --accent:#c8a86b;
    --quote:#b3aa97;
  }

  *{ box-sizing:border-box; }

  /* 兜底底色：滚到内容之外也不会露白 */
  html{
    min-height:100%;
    background-color:var(--bg);
  }

  body{
    margin:0;
    min-height:100%;
    background:transparent;          /* 渐变交给下面的固定层 */
    color:var(--fg);
    font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",Georgia,serif;
    font-size:17px;
    line-height:2.05;
    letter-spacing:.02em;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* 固定渐变层：始终贴合视口，不随滚动重复、不产生分界线 */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
    background:radial-gradient(1200px 620px at 50% -12%, #1a1c22 0%, transparent 72%);
  }

  #content{
    max-width:44rem;
    margin:0 auto;
    padding:5.5rem 1.5rem 9rem;
    animation:fade .9s ease both;
    transition:opacity .45s ease;
  }

  /* 弹幕开启时：正文淡出（保留布局，不产生跳动） */
  body.danmaku-on #content{
    animation:none;
    opacity:0;
    pointer-events:none;
  }

  @keyframes fade{
    from{ opacity:0; transform:translateY(10px); }
    to  { opacity:1; transform:none; }
  }

  /* ── 块：空行分隔出的一块内容 ── */
  .block{
    margin:0 0 1.95em;
  }
  .block p{
    margin:0;
  }
  /* 同一块内的多个段落（单换行产生）之间留一点点气口 */
  .block > * + *{
    margin-top:.55em;
  }

  /* ── 引用：被 _ 或 __ 包围的内容 ── */
  blockquote{
    margin:0;
    padding:.05em 0 .05em 1.1em;
    border-left:2px solid rgba(200,168,107,.35);
    color:var(--quote);
  }

  /* 同一块引用内的多个段落（单换行产生，每段都被 _ 包围）连接线条 */
  .block > blockquote + blockquote{
    margin-top: 0;          /* 抵消 .block > * + * 的间距 */
    padding-top: .55em;     /* 用 padding 代替 margin 制造行距 */
  }

  /* ── 二级标题 ── */
  h2.section{
    display:flex;
    align-items:center;
    gap:1.3rem;
    margin:5rem 0 2.6rem;
    font-size:1.05rem;
    font-weight:400;
    letter-spacing:.55em;
    text-indent:.55em;
    color:var(--accent);
    text-align:center;
  }
  h2.section:first-child{ margin-top:0; }
  h2.section::before,
  h2.section::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg,transparent,rgba(200,168,107,.38),transparent);
  }

  /* ── 读取失败时的兜底 ── */
  .notice{
    max-width:44rem;
    margin:5rem auto;
    padding:0 1.5rem;
    color:var(--muted);
    font-size:.95rem;
    line-height:2;
  }
  .notice code{
    color:var(--accent);
    font-family:ui-monospace,Consolas,monospace;
  }
  .notice input[type=file]{
    margin-top:1.2rem;
    color:var(--muted);
    font:inherit;
    font-size:.9rem;
  }

  ::selection{
    background:rgba(200,168,107,.25);
  }

  /* 细一点的滚动条 */
  ::-webkit-scrollbar{ width:10px; }
  ::-webkit-scrollbar-thumb{
    background:rgba(200,168,107,.18);
    border-radius:10px;
  }
  ::-webkit-scrollbar-track{ background:transparent; }

  /* ── 弹幕开关按钮 ── */
  #danmaku-toggle{
    position:fixed;
    right:1.25rem;
    bottom:1.25rem;
    z-index:80;
    padding:.55rem 1.15rem;
    font-family:inherit;
    font-size:.82rem;
    letter-spacing:.2em;
    text-indent:.2em;
    line-height:1.4;
    color:var(--accent);
    background:rgba(18,20,25,.78);
    border:1px solid rgba(200,168,107,.35);
    border-radius:999px;
    cursor:pointer;
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    transition:background .25s ease, border-color .25s ease, color .25s ease, transform .2s ease;
  }
  #danmaku-toggle:hover{
    background:rgba(200,168,107,.14);
    border-color:rgba(200,168,107,.62);
  }
  #danmaku-toggle:active{ transform:scale(.96); }
  #danmaku-toggle:focus-visible{
    outline:2px solid rgba(200,168,107,.6);
    outline-offset:3px;
  }
  #danmaku-toggle[aria-pressed="true"]{
    background:rgba(200,168,107,.9);
    border-color:transparent;
    color:#14161b;
  }

  /* ── 弹幕层 ── */
  #danmaku-layer{
    position:fixed;
    inset:0;
    z-index:60;
    overflow:hidden;
    pointer-events:none;
    display:none;
    contain:strict;
  }
  body.danmaku-on #danmaku-layer{ display:block; }

  .danmaku-item{
    position:absolute;
    left:100%;
    top:0;
    white-space:nowrap;
    font-size:.95rem;
    line-height:1.6;
    letter-spacing:.02em;
    color:var(--fg);
    text-shadow:
      0 1px 3px rgba(0,0,0,.85),
      0 0 10px rgba(0,0,0,.55);
    will-change:transform;
    backface-visibility:hidden;
  }
  .danmaku-item i{
    font-style:italic;
    color:var(--quote);
  }
</style>
</head>
<body>

<main id="content"></main>

<!-- 弹幕层（默认隐藏，JS 中填充） -->
<div id="danmaku-layer" aria-hidden="true"></div>

<!-- 弹幕开关 -->
<button id="danmaku-toggle" type="button" aria-pressed="false">弹幕</button>

<noscript>
  <div class="notice">本页面需要 JavaScript 才能读取并显示 chaos-word.md。</div>
</noscript>

<script>
(function () {
  'use strict';

  var SOURCE = 'chaos-word.md';
  var root = document.getElementById('content');
  var toggleBtn = document.getElementById('danmaku-toggle');
  var layerEl = document.getElementById('danmaku-layer');

  /* ------------------------------------------------------------------
   * 1. 切块
   *    - 空行（仅空白的行）=> 块与块之间的分隔
   *    - 单个换行         => 同一块内的多个段落
   *    - 以 ## 开头的行   => 二级标题，单独成块
   * ------------------------------------------------------------------ */
  function splitBlocks(text) {
    var lines = String(text).replace(/^\uFEFF/, '').split(/\r?\n/);
    var blocks = [];
    var buf = null;

    function flush() {
      if (buf && buf.lines.length) blocks.push(buf);
      buf = null;
    }

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();

      if (line === '') {            // 空行 => 断开
        flush();
        continue;
      }

      if (line.indexOf('##') === 0) { // 二级标题 => 单独一块
        flush();
        blocks.push({
          type: 'heading',
          text: line.replace(/^#+\s*/, '')
        });
        continue;
      }

      if (!buf) buf = { type: 'text', lines: [] };
      buf.lines.push(line);
    }
    flush();

    return blocks;
  }

  /* ------------------------------------------------------------------
   * 2. 识别引用
   *    __内容__  或  _内容_   => 引用，去掉包裹的下划线后显示
   *    （不做任何 Markdown 解析，* 等符号原样保留）
   * ------------------------------------------------------------------ */
  function stripQuote(line) {
    var m = /^__([\s\S]+)__$/.exec(line);
    if (m) return { text: m[1].trim(), quote: true };

    m = /^_([\s\S]+)_$/.exec(line);
    if (m) return { text: m[1].trim(), quote: true };

    return { text: line, quote: false };
  }

  /* ------------------------------------------------------------------
   * 3. 渲染正文
   * ------------------------------------------------------------------ */
  function render(text) {
    dmStop();                       // 重新渲染时先收掉弹幕

    var blocks = splitBlocks(text);
    var frag = document.createDocumentFragment();

    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];

      if (b.type === 'heading') {
        var h = document.createElement('h2');
        h.className = 'section';
        h.textContent = b.text;
        frag.appendChild(h);
        continue;
      }

      var box = document.createElement('div');
      box.className = 'block';

      for (var j = 0; j < b.lines.length; j++) {
        var q = stripQuote(b.lines[j]);
        var el = document.createElement(q.quote ? 'blockquote' : 'p');
        el.textContent = q.text;   // 一律用 textContent，避免任何意外的 HTML 注入
        box.appendChild(el);
      }

      frag.appendChild(box);
    }

    root.innerHTML = '';
    root.appendChild(frag);

    buildDanmakuItems(blocks);      // 同步准备弹幕素材
    if (DM.items.length) dmStart(); // ← 默认开启弹幕(doge)
    window.scrollTo(0, 0);
  }

  /* ==================================================================
   *  弹幕模块
   * ================================================================== */

  var DM = {
    active: false,
    items: [],        // 每条弹幕 = 一组 {text, quote}
    queue: [],        // 打乱后的待播队列
    nodes: [],        // 当前屏幕上的 DOM 节点
    timer: null,      // 调度定时器
    lanes: [],        // 每条轨道：{ freeAt, speed }；freeAt 之前该轨道不可再用
    laneHeight: 46,
    maxNodes: 45
  };

  /* 单调时钟（performance.now 与 Date.now 基准不同，比较时必须统一） */
  function nowMs() {
    return (window.performance && typeof performance.now === 'function')
      ? performance.now()
      : Date.now();
  }

  /* ---- 把正文块整理成「弹幕条目」：跳过 ## 标题，块内多行合并 ---- */
  function buildDanmakuItems(blocks) {
    var out = [];

    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.type !== 'text') continue;      // 不含二级标题

      var parts = [];
      for (var j = 0; j < b.lines.length; j++) {
        var q = stripQuote(b.lines[j]);
        if (q.text === '') continue;
        parts.push({ text: q.text, quote: q.quote });
      }
      if (parts.length) out.push(parts);
    }

    DM.items = out;
    DM.queue = [];
  }

  /* ---- Fisher–Yates 洗牌 ---- */
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  /* ---- 取下一条（队列空了就重新洗牌，保证次序随机且不停播） ---- */
  function nextItem() {
    if (!DM.items.length) return null;
    if (!DM.queue.length) DM.queue = shuffle(DM.items.slice());
    return DM.queue.shift();
  }

  /* ---- 生成一个弹幕 DOM ---- */
  function makeNode(parts) {
    var el = document.createElement('div');
    el.className = 'danmaku-item';

    for (var i = 0; i < parts.length; i++) {
      if (i) el.appendChild(document.createTextNode(' '));   // 多段合并为一行
      if (parts[i].quote) {
        var it = document.createElement('i');                // 引用 => 斜体
        it.textContent = parts[i].text;
        el.appendChild(it);
      } else {
        el.appendChild(document.createTextNode(parts[i].text));
      }
    }
    return el;
  }

  function removeNode(el) {
    var idx = DM.nodes.indexOf(el);
    if (idx > -1) DM.nodes.splice(idx, 1);
    if (el.parentNode) el.parentNode.removeChild(el);
  }

  /* ---- 发射一条弹幕 ---- */
  function spawn() {
    if (!DM.active || !DM.layerEl) return;
    if (DM.nodes.length >= DM.maxNodes) return;
    if (!DM.lanes.length) return;

    var now = nowMs();

    /* 1. 只在「空闲轨道」里随机挑一条；全忙就这轮不发，等下一次调度 */
    var free = [];
    for (var k = 0; k < DM.lanes.length; k++) {
      if (DM.lanes[k].freeAt <= now) free.push(k);
    }
    if (!free.length) return;

    var laneIdx = free[Math.floor(Math.random() * free.length)];
    var lane = DM.lanes[laneIdx];

    /* 2. 取内容（放在选完轨道之后，避免浪费队列） */
    var parts = nextItem();
    if (!parts) return;

    /* 3. 建节点、入层 */
    var el = makeNode(parts);
    el.style.top = (laneIdx * DM.laneHeight + 8) + 'px';
    DM.layerEl.appendChild(el);

    var vw = window.innerWidth;
    var w = el.getBoundingClientRect().width;

    /* 同轨道速度固定：后一条不会追上前一条 */
    var speed = lane.speed;
    var dur = ((vw + w) / speed) * 1000;        // 毫秒

    /* 4. 记下该轨道何时才能再发：
          尾部（右边缘）完全进入屏幕后，再与下一条留出 GAP 像素的间隔 */
    var GAP = 80;                                // 两条弹幕之间的最小水平像素间隔
    lane.freeAt = now + ((w + GAP) / speed) * 1000;

    DM.nodes.push(el);

    if (typeof el.animate === 'function') {
      var anim = el.animate(
        [
          { transform: 'translate3d(0,0,0)' },
          { transform: 'translate3d(' + (-(vw + w)) + 'px,0,0)' }
        ],
        { duration: dur, easing: 'linear', fill: 'forwards' }
      );
      anim.onfinish = function () { removeNode(el); };
    } else {
      setTimeout(function () { removeNode(el); }, dur);
    }
  }

  /* ---- 调度循环 ---- */
  function schedule() {
    if (!DM.active) return;
    spawn();
    DM.timer = setTimeout(schedule, 320 + Math.random() * 620);
  }

  /* ---- 开启 ---- */
  function dmStart() {
    if (DM.active || !DM.items.length) return;

    DM.active = true;
    DM.nodes = [];
    DM.queue = [];
    DM.layerEl = layerEl;
    DM.layerEl.innerHTML = '';

    /* 初始化轨道：每条轨道独立速度（同轨道固定，避免追尾），初始全部空闲 */
    var laneCount = Math.max(
      1,
      Math.floor((window.innerHeight - 40) / DM.laneHeight)
    );
    DM.lanes = [];
    for (var n = 0; n < laneCount; n++) {
      DM.lanes.push({
        freeAt: 0,
        speed: 90 + Math.random() * 70
      });
    }

    document.body.classList.add('danmaku-on');
    toggleBtn.setAttribute('aria-pressed', 'true');
    toggleBtn.textContent = '关闭弹幕';

    /* 开场先来一小串，避免空屏 */
    for (var i = 0; i < 4; i++) {
      setTimeout(spawn, i * 160);
    }
    DM.timer = setTimeout(schedule, 720);
  }

  /* ---- 关闭 ---- */
  function dmStop() {
    if (!DM.active) {
      /* 即使没开，也顺手清一下残留（比如重新渲染时） */
      if (DM.layerEl) DM.layerEl.innerHTML = '';
      DM.nodes = [];
      DM.lanes = [];
      DM.queue = [];
      return;
    }

    DM.active = false;

    if (DM.timer) {
      clearTimeout(DM.timer);
      DM.timer = null;
    }

    for (var i = 0; i < DM.nodes.length; i++) {
      var n = DM.nodes[i];
      if (n.parentNode) n.parentNode.removeChild(n);
    }
    DM.nodes = [];
    DM.lanes = [];

    if (DM.layerEl) DM.layerEl.innerHTML = '';

    document.body.classList.remove('danmaku-on');
    toggleBtn.setAttribute('aria-pressed', 'false');
    toggleBtn.textContent = '弹幕';
  }

  function dmToggle() {
    if (DM.active) dmStop();
    else dmStart();
  }

  toggleBtn.addEventListener('click', dmToggle);

  /* 窗口尺寸变化时重算轨道数 */
  window.addEventListener('resize', function () {
    if (!DM.active) return;
    var n = Math.max(
      1,
      Math.floor((window.innerHeight - 40) / DM.laneHeight)
    );
    /* 多退少补：保留已有轨道的 freeAt / speed，被截掉的弹幕仍会飞完自然移除 */
    while (DM.lanes.length < n) {
      DM.lanes.push({ freeAt: 0, speed: 90 + Math.random() * 70 });
    }
    if (DM.lanes.length > n) DM.lanes.length = n;
  });

  /* ==================================================================
   *  读取文件
   * ================================================================== */

  function showFallback(reason) {
    root.innerHTML = '';

    var wrap = document.createElement('div');
    wrap.className = 'notice';

    var p1 = document.createElement('p');
    p1.appendChild(document.createTextNode('未能自动读取 '));
    var code = document.createElement('code');
    code.textContent = SOURCE;
    p1.appendChild(code);
    p1.appendChild(document.createTextNode(
      '（' + reason + '）。请把本页面与 ' + SOURCE + ' 放在同一目录，' +
      '并通过 HTTP 服务（如 python -m http.server）访问；也可以在下方手动选择该文件：'
    ));

    var input = document.createElement('input');
    input.type = 'file';
    input.accept = '.md,.txt,text/markdown,text/plain';
    input.addEventListener('change', function () {
      var f = input.files && input.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () { render(String(reader.result)); };
      reader.readAsText(f, 'utf-8');
    });

    wrap.appendChild(p1);
    wrap.appendChild(input);
    root.appendChild(wrap);
  }

  function boot() {
    fetch(SOURCE, { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function (text) {
        // 有些服务器 404 时会回一个 HTML 页面，这里做个简单甄别
        if (/^\s*<(!doctype|html|\?xml)/i.test(text)) {
          throw new Error('返回的不是 Markdown 文本');
        }
        render(text);
      })
      .catch(function (err) {
        showFallback(err && err.message ? err.message : String(err));
      });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>

</body>
</html>
